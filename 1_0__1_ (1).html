<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nibuv — Resource</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Arial,Helvetica,sans-serif;color:#fff;background:#020914}
body{
  overflow-x:hidden;
  background:
    radial-gradient(circle at 50% 26%,rgba(0,150,210,.07),transparent 28%),
    radial-gradient(circle at 50% 70%,rgba(0,210,255,.055),transparent 34%),
    linear-gradient(180deg,#020914 0%,#031121 52%,#020a14 100%);
}
.topbar{
  height:105px;padding:14px 24px;display:flex;align-items:center;
  border-bottom:1px solid rgba(0,215,255,.23);background:rgba(2,10,22,.84);
  position:sticky;top:0;z-index:10;backdrop-filter:blur(8px)
}
.brand-logo{
  width:58px;height:58px;object-fit:contain;display:block;
  filter:drop-shadow(0 0 10px rgba(0,210,255,.22))
}
.page{
  width:min(100%,760px);margin:0 auto;padding:92px 24px 150px;
  transform:scale(.94);transform-origin:top center;
}
.section{
  position:relative;margin-bottom:145px;padding-top:22px;
}
.section-title{
  margin:0 0 38px;text-align:center;font-size:36px;letter-spacing:6px;
  color:#06d9ff;text-shadow:0 0 17px rgba(0,217,255,.55);font-weight:800
}
.orb{
  position:absolute;width:145px;height:145px;right:2%;top:0;border-radius:50%;
  opacity:.58;pointer-events:none;
  background:radial-gradient(circle at 45% 40%,#3d4d62,#26384b 63%,#18283a);
  box-shadow:0 0 32px rgba(70,130,175,.1)
}
.card{
  width:min(535px,82vw);min-height:690px;margin:0 auto;position:relative;
  padding:78px 42px 42px;overflow:hidden;border:2px solid #18bfff;
  border-radius:30px;background:
  radial-gradient(circle at 72% 54%,rgba(14,58,100,.34),transparent 45%),
  linear-gradient(145deg,rgba(3,18,33,.98),rgba(2,12,26,.98));
  box-shadow:0 0 32px rgba(0,202,255,.10),inset 0 0 48px rgba(0,150,255,.025)
}
.ribbon{
  position:absolute;left:-108px;top:48px;width:350px;padding:17px 0;
  transform:rotate(-45deg);text-align:center;
  background:linear-gradient(90deg,#08d8f5,#258dff);
  color:#001020;font-weight:900;font-size:23px;letter-spacing:1px
}
.badge{
  display:block;width:max-content;margin:0 auto 88px;padding:11px 20px;
  border:1px solid rgba(0,205,255,.38);border-radius:12px;
  color:#11dcff;background:rgba(3,36,53,.68);font-size:18px;font-weight:800
}
.card h2{text-align:center;font-size:37px;margin:0 0 115px;font-weight:800}
.card-logo{height:90px;display:grid;place-items:center;margin-bottom:108px;color:#00dfff;font-size:76px;text-shadow:0 0 22px #00dfff}
.card-btn{
  width:100%;height:66px;border:0;border-radius:16px;
  background:linear-gradient(90deg,#08d6e8,#3b83ff);color:#00101b;
  font-size:23px;font-weight:900;cursor:pointer;box-shadow:0 9px 27px rgba(0,180,255,.2)
}
.card-btn:active{transform:scale(.99)}
.divider{
  width:58%;height:1px;margin:0 auto 135px;
  background:linear-gradient(90deg,transparent,#00bddd,transparent);
  box-shadow:0 0 12px rgba(0,200,255,.3)
}
.modal{
  position:fixed;inset:0;z-index:50;display:none;padding:32px 16px;
  align-items:center;justify-content:center;background:rgba(0,4,12,.78);
  backdrop-filter:blur(6px)
}
.modal.show{display:flex}
.panel{
  width:min(710px,96vw);height:min(82vh,880px);position:relative;
  padding:38px 28px 24px;border:2px solid #00bfe7;border-radius:26px;
  background:linear-gradient(180deg,#061421,#071a29 60%,#061522);
  box-shadow:0 0 40px rgba(0,204,255,.16);overflow:hidden
}
.panel h3{
  margin:0 0 36px;text-align:center;font-size:36px;letter-spacing:4px
}
.close{
  position:absolute;right:13px;top:8px;border:0;background:transparent;color:#a8b5c1;
  font-size:42px;cursor:pointer;line-height:1
}
.items{
  height:calc(100% - 75px);overflow:auto;padding-right:8px;
  scrollbar-width:thin;scrollbar-color:#00a9cc transparent
}
.item{
  min-height:94px;margin-bottom:12px;padding:16px 18px;border-radius:15px;
  border:1px solid rgba(0,190,235,.2);background:rgba(4,28,43,.88);
  display:flex;align-items:center;justify-content:space-between;gap:15px
}
.item strong{display:block;color:#00d7ff;font-size:21px;margin-bottom:5px}
.item small{color:#81919f;font-size:15px}
.item button{
  width:88px;height:44px;border:2px solid #00c9ed;border-radius:9px;
  background:#071d2c;color:#e8fbff;font-size:14px;font-weight:800;cursor:default
}
@media(max-width:600px){
  .topbar{height:82px;padding:10px 17px}
  .brand-logo{width:52px;height:52px}
  .page{padding:62px 12px 120px;transform:scale(.92)}
  .section{margin-bottom:110px}
  .section-title{font-size:28px;letter-spacing:4px;margin-bottom:28px}
  .orb{width:110px;height:110px;right:0}
  .card{width:84vw;min-height:560px;padding:58px 25px 30px;border-radius:24px}
  .ribbon{left:-118px;top:37px;width:330px;font-size:19px;padding:14px 0}
  .badge{font-size:15px;margin-bottom:62px;padding:9px 15px}
  .card h2{font-size:29px;margin-bottom:86px}
  .card-logo{font-size:58px;height:70px;margin-bottom:80px}
  .card-btn{height:56px;font-size:19px}
  .divider{margin-bottom:105px}
  .panel{height:78vh;padding:30px 16px 18px;border-radius:22px}
  .panel h3{font-size:29px;margin-bottom:28px}
  .item{min-height:76px;padding:12px 12px}
  .item strong{font-size:17px}
  .item small{font-size:13px}
  .item button{width:72px;height:38px;font-size:12px}
}

/* AI Intelligence floating option */
.ai-float{position:fixed;right:18px;bottom:22px;z-index:100;width:96px;height:96px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:8px;border:2px solid #08d8f5;background:radial-gradient(circle at 35% 30%,#123b52,#061827 68%,#020914);color:#fff;text-decoration:none;text-align:center;box-shadow:0 0 18px rgba(0,210,255,.32),inset 0 0 18px rgba(0,190,255,.08);cursor:pointer;transition:transform .2s ease,box-shadow .2s ease}
.ai-float:hover{transform:scale(1.06);box-shadow:0 0 28px rgba(0,220,255,.55),inset 0 0 20px rgba(0,190,255,.12)}
.ai-float .ai-icon{font-size:23px;line-height:1;text-shadow:0 0 10px #00dfff}
.ai-float .ai-title{font-size:10px;line-height:1.1;font-weight:900;color:#08dcff;white-space:nowrap}
.ai-float .ai-subtitle{font-size:7px;line-height:1.1;color:#d8f7ff;white-space:nowrap}
@media(max-width:600px){.ai-float{right:12px;bottom:15px;width:86px;height:86px}.ai-float .ai-icon{font-size:21px}.ai-float .ai-title{font-size:9px}.ai-float .ai-subtitle{font-size:6.5px}}

/* =========================
   Integrated APK Builder
   ========================= */
.apk-builder-modal{
  position:fixed;
  inset:0;
  z-index:300;
  display:none;
  align-items:center;
  justify-content:center;
  padding:14px;
  background:rgba(0,3,10,.88);
  backdrop-filter:blur(8px);
}
.apk-builder-modal.show{display:flex}
.apk-builder-panel{
  width:min(980px,98vw);
  height:min(92vh,980px);
  position:relative;
  overflow:hidden;
  border:2px solid #10d8ff;
  border-radius:24px;
  background:#020914;
  box-shadow:0 0 45px rgba(0,215,255,.22);
}
.apk-builder-head{
  height:58px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  padding:8px 14px 8px 18px;
  border-bottom:1px solid rgba(0,215,255,.25);
  background:#061421;
}
.apk-builder-head strong{
  color:#10dcff;
  font-size:16px;
  letter-spacing:1px;
}
.apk-builder-head button{
  width:40px;
  height:40px;
  border:1px solid rgba(0,215,255,.35);
  border-radius:10px;
  background:#071d2c;
  color:#dffaff;
  font-size:28px;
  line-height:1;
  cursor:pointer;
}
.apk-builder-frame{
  display:block;
  width:100%;
  height:calc(100% - 58px);
  border:0;
  background:#020914;
}
.apk-builder-fallback{
  position:absolute;
  left:16px;
  right:16px;
  bottom:14px;
  z-index:2;
  display:flex;
  justify-content:center;
  pointer-events:none;
}
.apk-builder-fallback a{
  pointer-events:auto;
  display:inline-flex;
  align-items:center;
  justify-content:center;
  min-height:42px;
  padding:10px 18px;
  border-radius:12px;
  border:1px solid rgba(0,215,255,.35);
  background:rgba(4,25,40,.94);
  color:#bff6ff;
  text-decoration:none;
  font-weight:800;
  font-size:13px;
}
@media(max-width:600px){
  .apk-builder-modal{padding:0}
  .apk-builder-panel{
    width:100vw;
    height:100dvh;
    border-radius:0;
    border-left:0;
    border-right:0;
  }
  .apk-builder-head{height:54px}
  .apk-builder-frame{height:calc(100% - 54px)}
}


.interview-float{position:fixed;left:16px;bottom:22px;z-index:100;width:108px;height:108px;border-radius:20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;padding:10px;border:2px solid #18cfff;background:radial-gradient(circle at 35% 25%,#123c55,#061827 70%,#020914);color:#fff;text-decoration:none;text-align:center;box-shadow:0 0 20px rgba(0,210,255,.30),inset 0 0 20px rgba(0,190,255,.10);cursor:pointer;overflow:hidden;transition:transform .2s ease,box-shadow .2s ease}
.interview-float::before{content:"SEC";position:absolute;left:-31px;top:12px;width:88px;padding:5px 0;transform:rotate(-45deg);background:linear-gradient(90deg,#08d8f5,#258dff);color:#001020;font-size:10px;font-weight:900;letter-spacing:1px}
.interview-float:hover{transform:scale(1.06);box-shadow:0 0 30px rgba(0,220,255,.55),inset 0 0 22px rgba(0,190,255,.14)}
.interview-float .interview-icon{font-size:25px;line-height:1;color:#eafcff;text-shadow:0 0 10px #00dfff;margin-top:8px}
.interview-float .interview-title{font-size:11px;line-height:1.1;font-weight:900;letter-spacing:1px;color:#08dcff;white-space:nowrap}
.interview-float .interview-subtitle{font-size:7px;line-height:1.1;color:#d8f7ff;white-space:nowrap}
@media(max-width:600px){.interview-float{left:10px;bottom:15px;width:92px;height:92px;border-radius:17px}.interview-float::before{left:-32px;top:10px;font-size:9px}.interview-float .interview-icon{font-size:21px}.interview-float .interview-title{font-size:9px}.interview-float .interview-subtitle{font-size:6px}}
</style>

  let nirabUrl = null;

  function openNirab() {
    if (!nirabUrl) {
      const bin = atob(NIRAB_B64);
      const bytes = Uint8Array.from(bin, c => c.charCodeAt(0));
      const html = new TextDecoder('utf-8').decode(bytes);
      nirabUrl = URL.createObjectURL(new Blob([html], { type: 'text/html;charset=utf-8' }));
    }
    nirabFrame.src = nirabUrl;
    nirabModal.classList.add('show');
    nirabModal.setAttribute('aria-hidden', 'false');
    document.body.style.overflow = 'hidden';
  }

  function closeNirab() {
    nirabModal.classList.remove('show');
    nirabModal.setAttribute('aria-hidden', 'true');
    nirabFrame.src = 'about:blank';
  }

  nirabClose.addEventListener('click', closeNirab);
  nirabModal.addEventListener('click', e => {
    if (e.target === nirabModal) closeNirab();
  });

  // Option 10 opens its external link, option 20 opens the Nirab interface.
  document.querySelectorAll('.item').forEach(item => {
    const btn = item.querySelector('button');
    const version = item.querySelector('strong');
    if (!btn || !version) return;

    btn.addEventListener('click', e => {
      e.preventDefault();
      if (version.textContent.trim() === '10') {
        window.location.href = 'https://devyasin.online/?version-3.0';
      }
      if (version.textContent.trim() === '20') {
        openNirab();
      }
    });
  });
</script>
